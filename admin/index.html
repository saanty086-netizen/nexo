<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Nexo Store</title>
  <link rel="icon" type="image/png" href="../favicon-32.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      padding: 24px;
      min-height: 100vh;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid #1e293b;
    }
    .header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #38bdf8;
    }
    .btn-action {
      background-color: #2563eb;
      color: white;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      transition: background 0.2s;
    }
    .btn-action:hover {
      background-color: #1d4ed8;
    }
    /* Menú de Filtros */
    .tabs-container {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .tab-btn {
      background-color: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .tab-btn:hover {
      background-color: #334155;
      color: #f8fafc;
    }
    .tab-btn.active {
      background-color: #38bdf8;
      color: #0f172a;
      border-color: #38bdf8;
    }
    .badge {
      padding: 2px 8px;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
      background: rgba(0, 0, 0, 0.2);
    }
    .tab-btn.active .badge {
      background: #0f172a;
      color: #38bdf8;
    }
    /* Tabla */
    .table-container {
      background-color: #1e293b;
      border-radius: 12px;
      overflow-x: auto;
      border: 1px solid #334155;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    th, td {
      padding: 14px 18px;
      border-bottom: 1px solid #334155;
      font-size: 0.9rem;
    }
    th {
      background-color: #0b1120;
      color: #94a3b8;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
    }
    tr:hover {
      background-color: rgba(255, 255, 255, 0.02);
    }
    /* Estados y botones */
    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .status-active {
      background-color: rgba(34, 197, 94, 0.15);
      color: #4ade80;
    }
    .status-expiring {
      background-color: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
    }
    .status-expired {
      background-color: rgba(239, 68, 68, 0.15);
      color: #f87171;
    }
    .btn-wsp {
      background-color: #25D366;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
    }
    .btn-wsp:hover {
      background-color: #1eb956;
    }
    .empty-state {
      padding: 40px;
      text-align: center;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>Panel de Administración - Nexo</h1>
    <div>
      <a href="registro.html" class="btn-action">+ Registrar Venta</a>
    </div>
  </div>

  <!-- Menú de pestañas -->
  <div class="tabs-container">
    <button class="tab-btn active" onclick="cambiarFiltro('todos', this)">
      Todas las cuentas <span class="badge" id="count-todos">0</span>
    </button>
    <button class="tab-btn" onclick="cambiarFiltro('activas', this)">
      Cuentas Activas <span class="badge" id="count-activas">0</span>
    </button>
    <button class="tab-btn" onclick="cambiarFiltro('por-vencer', this)">
      Próximas a vencer (≤ 3 días) <span class="badge" id="count-por-vencer">0</span>
    </button>
  </div>

  <!-- Contenedor de la tabla -->
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Cliente</th>
          <th>Servicio</th>
          <th>Teléfono</th>
          <th>Vencimiento</th>
          <th>Estado / Restante</th>
          <th>Acción</th>
        </tr>
      </thead>
      <tbody id="tabla-clientes">
        <tr>
          <td colspan="6" class="empty-state">Cargando cuentas...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Firebase Scripts -->
  <script type="module">
    import { db } from "../firebase.js";
    import { collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    let clientesData = [];
    let filtroActual = 'todos';

    // Función auxiliar para calcular días restantes exactos
    function calcularDias(fechaStr) {
      if (!fechaStr) return -999;
      const hoy = new Date();
      hoy.setHours(0, 0, 0, 0);

      const [year, month, day] = fechaStr.split('-').map(Number);
      const vencimiento = new Date(year, month - 1, day);
      vencimiento.setHours(0, 0, 0, 0);

      const MS_POR_DIA = 1000 * 60 * 60 * 24;
      return Math.round((vencimiento - hoy) / MS_POR_DIA);
    }

    // Carga de datos desde Firestore
    async function cargarClientes() {
      try {
        const q = query(collection(db, "ventas"), orderBy("fechaVencimiento", "asc"));
        const snapshot = await getDocs(q);
        
        clientesData = [];
        snapshot.forEach(docSnap => {
          const data = docSnap.data();
          const dias = calcularDias(data.fechaVencimiento);
          clientesData.push({
            id: docSnap.id,
            ...data,
            diasRestantes: dias
          });
        });

        actualizarContadores();
        renderizarTabla();
      } catch (error) {
        console.error("Error al cargar ventas:", error);
        document.getElementById('tabla-clientes').innerHTML = `
          <tr><td colspan="6" class="empty-state" style="color: #f87171;">Error al conectar con la base de datos.</td></tr>
        `;
      }
    }

    // Actualiza los badges numéricos de las pestañas
    function actualizarContadores() {
      const total = clientesData.length;
      const activas = clientesData.filter(c => c.diasRestantes > 3).length;
      const porVencer = clientesData.filter(c => c.diasRestantes >= 0 && c.diasRestantes <= 3).length;

      document.getElementById('count-todos').textContent = total;
      document.getElementById('count-activas').textContent = activas;
      document.getElementById('count-por-vencer').textContent = porVencer;
    }

    // Genera el enlace de WhatsApp codificado
    window.enviarWhatsApp = function(clienteJson) {
      const cliente = JSON.parse(decodeURIComponent(clienteJson));
      let tel = String(cliente.telefono || '').replace(/\D/g, '');
      
      // Autoformato para Argentina si se cargaron 10 dígitos (sin 0 ni 15)
      if (tel.length === 10) tel = '549' + tel;

      const texto = 
`¡Hola, *${cliente.nombre || 'Cliente'}*! 👋

Te avisamos desde *Nexo* que tu suscripción está próxima a vencer.

📌 *Detalle de tu cuenta:*
• Servicio: *${cliente.servicio || 'Digital'}*
• Vencimiento: *${cliente.fechaVencimiento || 'Pronto'}* (${cliente.diasRestantes === 0 ? '¡Vence hoy!' : 'en ' + cliente.diasRestantes + ' días'})
• Total a renovar: *$${cliente.precio || cliente.monto || '0'}*

Para renovar tu pantalla y no perder el acceso, respondé a este mensaje. 🚀`;

      window.open(`https://wa.me/${tel}?text=${encodeURIComponent(texto)}`, '_blank');
    };

    // Renderiza la tabla filtrada según la pestaña activa
    function renderizarTabla() {
      const tbody = document.getElementById('tabla-clientes');
      tbody.innerHTML = '';

      const filtrados = clientesData.filter(c => {
        if (filtroActual === 'activas') return c.diasRestantes > 3;
        if (filtroActual === 'por-vencer') return c.diasRestantes >= 0 && c.diasRestantes <= 3;
        return true;
      });

      if (filtrados.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" class="empty-state">No hay cuentas en este estado.</td></tr>`;
        return;
      }

      filtrados.forEach(c => {
        let estadoBadge = '';
        let botonAccion = '-';

        if (c.diasRestantes < 0) {
          estadoBadge = `<span class="status-badge status-expired">Vencida (${Math.abs(c.diasRestantes)}d atrás)</span>`;
        } else if (c.diasRestantes <= 3) {
          estadoBadge = `<span class="status-badge status-expiring">Vence en ${c.diasRestantes}d</span>`;
          botonAccion = `
            <button class="btn-wsp" onclick="enviarWhatsApp('${encodeURIComponent(JSON.stringify(c))}')">
              💬 Avisar
            </button>
          `;
        } else {
          estadoBadge = `<span class="status-badge status-active">Activa (${c.diasRestantes}d)</span>`;
        }

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${c.nombre || 'Sin nombre'}</strong></td>
          <td>${c.servicio || '-'}</td>
          <td>${c.telefono || '-'}</td>
          <td>${c.fechaVencimiento || '-'}</td>
          <td>${estadoBadge}</td>
          <td>${botonAccion}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Manejador del menú de pestañas
    window.cambiarFiltro = function(filtro, elemento) {
      filtroActual = filtro;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      elemento.classList.add('active');
      renderizarTabla();
    };

    cargarClientes();
  </script>
</body>
</html>
