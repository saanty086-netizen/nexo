<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NEXO STORE — Panel de administración</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg: '#08050f',
          panel: '#0f0a1c',
          panel2: '#150e28',
          line: '#241a3d',
          violet: '#9146ff',
          violet2: '#c9a3ff',
          cyan: '#4ff2ff',
          ink: '#ece6fa',
          mute: '#8b80ab',
          warn: '#ffb84f',
          ok: '#4fffa0',
          bad: '#ff5f7e'
        },
        fontFamily: {
          display: ['"Chakra Petch"', 'sans-serif'],
          mono: ['"JetBrains Mono"', 'monospace']
        }
      }
    }
  };
</script>
<style>
  body { background-color: #08050f; }
  .glow-border { box-shadow: 0 0 0 1px rgba(145,70,255,0.25); }
  .clip-corner { clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); }
  .hidden-modal { display: none; }
  select.estado-select { -webkit-appearance: none; appearance: none; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: #08050f; }
  ::-webkit-scrollbar-thumb { background: #241a3d; border-radius: 4px; }
  tbody tr { border-bottom: 1px solid #241a3d; }
</style>
</head>
<body class="font-mono text-ink min-h-screen">

<!-- ============ TOPBAR ============ -->
<header class="border-b border-line bg-panel px-5 md:px-8 py-4">
  <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-full border-2 border-violet flex items-center justify-center">
        <span class="font-display font-bold text-cyan text-base">N</span>
      </div>
      <div>
        <p class="font-display font-bold text-base leading-none">NEXO</p>
        <p class="text-[10px] text-mute tracking-[0.2em] mt-1">PANEL ADMIN</p>
      </div>
    </div>

    <div class="flex flex-wrap items-center gap-3 text-sm">
      <div class="px-3.5 py-2 border border-line bg-panel2 clip-corner">
        <span class="text-mute text-[11px]">Total</span>
        <span id="count-total" class="font-display font-bold text-ink ml-2">0</span>
      </div>
      <div class="px-3.5 py-2 border border-line bg-panel2 clip-corner">
        <span class="text-[11px]">⏳ Espera</span>
        <span id="count-espera" class="font-display font-bold text-warn ml-2">0</span>
      </div>
      <div class="px-3.5 py-2 border border-line bg-panel2 clip-corner">
        <span class="text-[11px]">✅ Activos</span>
        <span id="count-activo" class="font-display font-bold text-ok ml-2">0</span>
      </div>
      <button id="btn-logout" class="text-[11px] text-mute hover:text-bad transition-colors ml-1">Cerrar sesión</button>
    </div>
  </div>
</header>

<main class="max-w-7xl mx-auto px-5 md:px-8 py-8">

  <!-- ============ FILTROS ============ -->
  <div class="flex flex-wrap items-center gap-3 mb-6">
    <input id="input-buscar" type="text" placeholder="Buscar por nombre, teléfono o servicio..."
      class="flex-1 min-w-[220px] bg-panel2 border border-line px-3.5 py-2.5 text-sm placeholder:text-mute/60 focus:outline-none focus:border-cyan" />

    <select id="select-filtro-estado"
      class="estado-select bg-panel2 border border-line px-3.5 py-2.5 text-sm text-ink focus:outline-none focus:border-cyan">
      <option value="todos">Todos</option>
      <option value="espera">En espera</option>
      <option value="activo">Activo</option>
      <option value="cancelado">Cancelado</option>
    </select>

    <button id="btn-agregar"
      class="bg-gradient-to-r from-violet to-cyan text-bg font-display font-bold text-sm px-5 py-2.5 hover:opacity-90 transition-opacity whitespace-nowrap">
      + Agregar cliente
    </button>
  </div>

  <!-- ============ TABLA ============ -->
  <div class="border border-line bg-panel clip-corner overflow-x-auto">
    <table class="w-full text-sm min-w-[900px]">
      <thead>
        <tr class="text-left text-[11px] text-mute border-b border-line">
          <th class="px-4 py-3 font-medium">#</th>
          <th class="px-4 py-3 font-medium">Llegada</th>
          <th class="px-4 py-3 font-medium">Cliente</th>
          <th class="px-4 py-3 font-medium">Teléfono</th>
          <th class="px-4 py-3 font-medium">Servicio</th>
          <th class="px-4 py-3 font-medium">Estado</th>
          <th class="px-4 py-3 font-medium">Pago</th>
          <th class="px-4 py-3 font-medium">Acciones</th>
        </tr>
      </thead>
      <tbody id="tabla-pedidos"></tbody>
    </table>
    <p id="tabla-vacio" class="hidden-modal text-center text-mute text-sm py-10">No hay pedidos que coincidan con el filtro.</p>
  </div>
</main>

<!-- ============ TEMPLATE: FILA ============ -->
<template id="tpl-fila">
  <tr class="hover:bg-panel2/60 transition-colors align-middle">
    <td class="px-4 py-3 text-mute" data-field="indice"></td>
    <td class="px-4 py-3 text-mute text-xs whitespace-nowrap" data-field="fecha"></td>
    <td class="px-4 py-3 font-semibold" data-field="nombre"></td>
    <td class="px-4 py-3 text-mute" data-field="telefono"></td>
    <td class="px-4 py-3" data-field="servicio"></td>
    <td class="px-4 py-3">
      <select data-field="estado-select" class="estado-select bg-panel2 border border-line px-2.5 py-1.5 text-xs focus:outline-none focus:border-cyan">
        <option value="espera">En espera</option>
        <option value="activo">Activo</option>
        <option value="cancelado">Cancelado</option>
      </select>
    </td>
    <td class="px-4 py-3">
      <button data-field="pago-badge" class="text-[11px] font-semibold px-2.5 py-1.5 clip-corner border transition-colors"></button>
    </td>
    <td class="px-4 py-3">
      <div class="flex items-center gap-2 whitespace-nowrap">
        <button data-field="btn-chat" class="text-[11px] text-cyan border border-cyan/40 px-2.5 py-1.5 hover:bg-cyan hover:text-bg transition-colors">Chat</button>
        <button data-field="btn-editar" class="text-[11px] text-violet2 border border-violet/40 px-2.5 py-1.5 hover:bg-violet hover:text-bg transition-colors">Editar</button>
        <button data-field="btn-eliminar" class="text-[11px] text-bad border border-bad/40 px-2.5 py-1.5 hover:bg-bad hover:text-bg transition-colors">Eliminar</button>
      </div>
    </td>
  </tr>
</template>

<!-- ============ MODAL: AGREGAR / EDITAR CLIENTE ============ -->
<div id="modal-cliente" class="hidden-modal fixed inset-0 z-50 items-center justify-center px-4 bg-bg/80 backdrop-blur-sm">
  <div class="w-full max-w-sm bg-panel border border-line clip-corner glow-border p-6 relative">
    <button data-close-modal class="absolute top-4 right-4 text-mute hover:text-cyan text-sm">✕</button>

    <p id="modal-cliente-titulo-eyebrow" class="text-cyan text-xs tracking-[0.2em] font-semibold mb-1">CLIENTE</p>
    <h3 id="modal-cliente-titulo" class="font-display font-bold text-xl mb-5">Agregar cliente</h3>

    <form id="form-cliente" class="flex flex-col gap-4">
      <div>
        <label class="text-xs text-mute block mb-1.5">Nombre completo</label>
        <input required id="cliente-nombre" type="text" placeholder="Nombre del cliente"
          class="w-full bg-panel2 border border-line px-3 py-2.5 text-sm placeholder:text-mute/60 focus:outline-none focus:border-cyan" />
      </div>
      <div>
        <label class="text-xs text-mute block mb-1.5">Número de WhatsApp</label>
        <input required id="cliente-telefono" type="tel" placeholder="+549 261 xxxxxxx"
          class="w-full bg-panel2 border border-line px-3 py-2.5 text-sm placeholder:text-mute/60 focus:outline-none focus:border-cyan" />
      </div>
      <div>
        <label class="text-xs text-mute block mb-1.5">Servicio</label>
        <input required id="cliente-servicio" type="text" placeholder="Ej: Netflix Premium"
          class="w-full bg-panel2 border border-line px-3 py-2.5 text-sm placeholder:text-mute/60 focus:outline-none focus:border-cyan" />
      </div>
      <div>
        <label class="text-xs text-mute block mb-1.5">Estado</label>
        <select id="cliente-estado" class="estado-select w-full bg-panel2 border border-line px-3 py-2.5 text-sm focus:outline-none focus:border-cyan">
          <option value="espera">En espera</option>
          <option value="activo">Activo</option>
          <option value="cancelado">Cancelado</option>
        </select>
      </div>

      <p id="cliente-status" class="text-xs text-mute min-h-[1rem]"></p>

      <button type="submit" id="btn-guardar-cliente"
        class="w-full bg-gradient-to-r from-violet to-cyan text-bg font-display font-bold text-sm py-3 mt-1 hover:opacity-90 transition-opacity">
        Guardar
      </button>
    </form>
  </div>
</div>

<script type="module">
  // -----------------------------
  // Firebase — SDK modular v10
  // -----------------------------
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import {
    getAuth,
    onAuthStateChanged,
    signOut
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import {
    getFirestore,
    collection,
    query,
    orderBy,
    onSnapshot,
    doc,
    getDoc,
    addDoc,
    updateDoc,
    deleteDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyD16l3a-H3llIYRK_7La-3IUiCIM7uRi3k",
    authDomain: "nexo-aeb5a.firebaseapp.com",
    databaseURL: "https://nexo-aeb5a-default-rtdb.firebaseio.com",
    projectId: "nexo-aeb5a",
    storageBucket: "nexo-aeb5a.firebasestorage.app",
    messagingSenderId: "553737684793",
    appId: "1:553737684793:web:0267a5bbfbc2c0c575cae8"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const pedidosRef = collection(db, "pedidos_nexo");

  // -----------------------------
  // Guard de acceso: requiere sesión + documento en admins/{uid}
  // -----------------------------
  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      window.location.href = "index.html";
      return;
    }
    const adminDocSnap = await getDoc(doc(db, "admins", user.uid));
    if (!adminDocSnap.exists()) {
      window.location.href = "index.html";
      return;
    }
    iniciarEscuchaPedidos();
  });

  document.getElementById("btn-logout").addEventListener("click", async () => {
    await signOut(auth);
    window.location.href = "index.html";
  });

  // -----------------------------
  // Estado en memoria + render
  // -----------------------------
  let pedidosCache = [];
  const WHATSAPP_LABEL_ESTADO = {
    espera: "En espera",
    activo: "Activo",
    cancelado: "Cancelado"
  };

  const tabla = document.getElementById("tabla-pedidos");
  const tablaVacio = document.getElementById("tabla-vacio");
  const inputBuscar = document.getElementById("input-buscar");
  const selectFiltroEstado = document.getElementById("select-filtro-estado");
  const tpl = document.getElementById("tpl-fila");

  function iniciarEscuchaPedidos() {
    const q = query(pedidosRef, orderBy("fecha", "desc"));
    onSnapshot(q, (snapshot) => {
      pedidosCache = snapshot.docs.map((docSnap) => ({ id: docSnap.id, ...docSnap.data() }));
      actualizarContadores();
      renderTabla();
    });
  }

  function actualizarContadores() {
    document.getElementById("count-total").textContent = pedidosCache.length;
    document.getElementById("count-espera").textContent =
      pedidosCache.filter((p) => p.estado === "espera").length;
    document.getElementById("count-activo").textContent =
      pedidosCache.filter((p) => p.estado === "activo").length;
  }

  function formatearFecha(fechaField) {
    if (!fechaField || !fechaField.toDate) return "—";
    const d = fechaField.toDate();
    return d.toLocaleDateString("es-AR") + " " + d.toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" });
  }

  function pedidosFiltrados() {
    const texto = inputBuscar.value.trim().toLowerCase();
    const filtroEstado = selectFiltroEstado.value;

    return pedidosCache.filter((p) => {
      const coincideEstado = filtroEstado === "todos" || p.estado === filtroEstado;
      const coincideTexto =
        !texto ||
        (p.nombre || "").toLowerCase().includes(texto) ||
        (p.telefono || "").toLowerCase().includes(texto) ||
        (p.servicio || "").toLowerCase().includes(texto);
      return coincideEstado && coincideTexto;
    });
  }

  function pintarBadgePago(btn, pagado) {
    btn.textContent = pagado ? "Pagado" : "Pendiente";
    btn.className = pagado
      ? "text-[11px] font-semibold px-2.5 py-1.5 clip-corner border transition-colors bg-ok/10 border-ok/50 text-ok"
      : "text-[11px] font-semibold px-2.5 py-1.5 clip-corner border transition-colors bg-warn/10 border-warn/50 text-warn";
  }

  function renderTabla() {
    const lista = pedidosFiltrados();
    tabla.innerHTML = "";

    if (lista.length === 0) {
      tablaVacio.classList.remove("hidden-modal");
    } else {
      tablaVacio.classList.add("hidden-modal");
    }

    lista.forEach((pedido, index) => {
      const nodo = tpl.content.cloneNode(true);

      nodo.querySelector('[data-field="indice"]').textContent = index + 1;
      nodo.querySelector('[data-field="fecha"]').textContent = formatearFecha(pedido.fecha);
      nodo.querySelector('[data-field="nombre"]').textContent = pedido.nombre || "—";
      nodo.querySelector('[data-field="telefono"]').textContent = pedido.telefono || "—";
      nodo.querySelector('[data-field="servicio"]').textContent = pedido.servicio || "—";

      const estadoSelect = nodo.querySelector('[data-field="estado-select"]');
      estadoSelect.value = pedido.estado || "espera";
      estadoSelect.addEventListener("change", async () => {
        await updateDoc(doc(db, "pedidos_nexo", pedido.id), { estado: estadoSelect.value });
      });

      const pagoBtn = nodo.querySelector('[data-field="pago-badge"]');
      pintarBadgePago(pagoBtn, !!pedido.pagado);
      pagoBtn.addEventListener("click", async () => {
        await updateDoc(doc(db, "pedidos_nexo", pedido.id), { pagado: !pedido.pagado });
      });

      nodo.querySelector('[data-field="btn-chat"]').addEventListener("click", () => {
        const mensaje = `Hola ${pedido.nombre || ""}! Te escribimos por tu pedido de ${pedido.servicio || "tu servicio"} en NEXO.`;
        const telefonoLimpio = (pedido.telefono || "").replace(/[^0-9]/g, "");
        window.open(`https://wa.me/${telefonoLimpio}?text=${encodeURIComponent(mensaje)}`, "_blank");
      });

      nodo.querySelector('[data-field="btn-editar"]').addEventListener("click", () => {
        abrirModalCliente(pedido);
      });

      nodo.querySelector('[data-field="btn-eliminar"]').addEventListener("click", async () => {
        const confirmar = window.confirm(`¿Eliminar el pedido de ${pedido.nombre || "este cliente"}? Esta acción no se puede deshacer.`);
        if (confirmar) {
          await deleteDoc(doc(db, "pedidos_nexo", pedido.id));
        }
      });

      tabla.appendChild(nodo);
    });
  }

  inputBuscar.addEventListener("input", renderTabla);
  selectFiltroEstado.addEventListener("change", renderTabla);

  // -----------------------------
  // Modal agregar / editar cliente
  // -----------------------------
  const modalCliente = document.getElementById("modal-cliente");
  const formCliente = document.getElementById("form-cliente");
  const clienteNombre = document.getElementById("cliente-nombre");
  const clienteTelefono = document.getElementById("cliente-telefono");
  const clienteServicio = document.getElementById("cliente-servicio");
  const clienteEstado = document.getElementById("cliente-estado");
  const clienteStatus = document.getElementById("cliente-status");
  const modalClienteTitulo = document.getElementById("modal-cliente-titulo");
  const modalClienteEyebrow = document.getElementById("modal-cliente-titulo-eyebrow");
  const btnGuardarCliente = document.getElementById("btn-guardar-cliente");

  let pedidoEnEdicionId = null;

  function abrirModalCliente(pedido) {
    formCliente.reset();
    clienteStatus.textContent = "";

    if (pedido) {
      pedidoEnEdicionId = pedido.id;
      modalClienteEyebrow.textContent = "EDITAR CLIENTE";
      modalClienteTitulo.textContent = "Editar pedido";
      clienteNombre.value = pedido.nombre || "";
      clienteTelefono.value = pedido.telefono || "";
      clienteServicio.value = pedido.servicio || "";
      clienteEstado.value = pedido.estado || "espera";
    } else {
      pedidoEnEdicionId = null;
      modalClienteEyebrow.textContent = "NUEVO CLIENTE";
      modalClienteTitulo.textContent = "Agregar cliente";
      clienteEstado.value = "espera";
    }

    modalCliente.classList.remove("hidden-modal");
    modalCliente.classList.add("flex");
  }

  function cerrarModalCliente() {
    modalCliente.classList.add("hidden-modal");
    modalCliente.classList.remove("flex");
  }

  document.getElementById("btn-agregar").addEventListener("click", () => abrirModalCliente(null));
  document.querySelectorAll("[data-close-modal]").forEach((btn) => btn.addEventListener("click", cerrarModalCliente));
  modalCliente.addEventListener("click", (e) => {
    if (e.target === modalCliente) cerrarModalCliente();
  });

  formCliente.addEventListener("submit", async (e) => {
    e.preventDefault();

    const datos = {
      nombre: clienteNombre.value.trim(),
      telefono: clienteTelefono.value.trim(),
      servicio: clienteServicio.value.trim(),
      estado: clienteEstado.value
    };

    btnGuardarCliente.disabled = true;
    btnGuardarCliente.textContent = "Guardando...";

    try {
      if (pedidoEnEdicionId) {
        await updateDoc(doc(db, "pedidos_nexo", pedidoEnEdicionId), datos);
      } else {
        await addDoc(pedidosRef, {
          ...datos,
          pagado: false,
          fecha: serverTimestamp()
        });
      }
      cerrarModalCliente();
    } catch (err) {
      console.error(err);
      clienteStatus.textContent = "No se pudo guardar. Intentá de nuevo.";
    } finally {
      btnGuardarCliente.disabled = false;
      btnGuardarCliente.textContent = "Guardar";
    }
  });
</script>
</body>
</html>
